# Render blueprint for the CareerLens backend (https://render.com/docs/blueprint-spec).
# Frontend is deployed separately on Vercel (frontend/vercel.json, M2). Set the secret values in the Render
# dashboard: every `sync: false` var is prompted for on first deploy and never stored in git.
services:
  - type: web
    name: careerlens-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true          # every merge to main redeploys
    envVars:
      - key: PORT
        value: "8000"
      # ---- LLM: the team runs on Groq through the OpenAI-compatible path (same values as .env)
      - key: LLM_PROVIDER
        value: openai         # anthropic | openai | groq | deepseek | grok | ollama
      - key: OPENAI_API_KEY
        sync: false           # the Groq key (gsk_...)
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_FALLBACK_MODEL
        value: openai/gpt-oss-20b,qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false           # same Groq key; the interview module's Whisper transcription reads this one
      - key: ANTHROPIC_API_KEY
        sync: false           # only if LLM_PROVIDER=anthropic
      - key: EMBED_PROVIDER
        value: local          # local (MiniLM baked into the image) | openai
      # ---- Job market: real postings via JSearch (rapidapi.com); without the key the labelled sample dataset is shown
      - key: RAPIDAPI_KEY
        sync: false
      - key: JOBS_SOURCE
        value: live
      # ---- Evidence
      - key: GITHUB_TOKEN
        sync: false           # optional: raises the GitHub API limit from 60 to 5000 req/h
      # ---- Browser origins allowed to call the API: the Vercel site (and localhost for local testing)
      - key: CORS_ORIGINS
        sync: false           # e.g. https://careerlens.vercel.app,http://localhost:5173
      # ---- Offline demo replay when the LLM is unreachable
      - key: LLM_CACHE_PATH
        value: demo/cached_responses.json
      - key: GITHUB_CACHE_PATH
        value: demo/cached_responses.json
